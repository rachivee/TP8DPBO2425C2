<!DOCTYPE html>
<html>
<head>
    <title>Edit Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>

<div class="container my-4">
    <h2> Edit Course</h2>
        <form method="post" action="course.php">
        <input type="hidden" name="id" value="VAL_ID">

        <div class="mb-3"><
            <label>Course Name:</label>
            <input type="text" name="course_name" value="VAL_NAME" required class="form-control">
        </div>

        <div class="mb-3"><
           <label>Course Code:</label>
            <input type="text" name="course_code" value="VAL_CODE" required class="form-control">
        </div>

        <div class="mb-3">
            <label>< Credits:</label>
            <input type="number" name="credits" min="1" max="6" value="VAL_CREDITS" required class="form-control">
        </div>
        
        <label>< Lecturer:</label>
            <select name="lecturer_id" class="form-control" required>
                OPTIONS_LECTURER
            </select><br>

            
            <button class="btn btn-warning" type="submit" name="edit"> Update </button>
            <a class="btn btn-secondary" href="course.php"> Cancel </a>
        </div>
    </form>
</div>
</body>
</html>

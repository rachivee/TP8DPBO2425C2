<!DOCTYPE html>
<html>

<head>
    <title>Add Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
  <div class="container my-4">
    <h2>Add New Course</h2>

    <form method="post" action="course.php">
      <div class="mb-3">
        <label>Course Name:</label>
            <input type="text" name="course_name" required class="form-control">
      </div>

      <div class="mb-3">
        <label>Course Code:</label>
            <input type="text" name="course_code" required class="form-control">
      </div>

      <div class="mb-3">
        <label>Credits:</label>
        <input type="number" name="credits" min="1" max="6" required class="form-control">
      </div>

      <label>Lecturer:</label>
            <select name="lecturer_id" class="form-control" required>
                <option value="">-- Select Lecturer --</option>
                    OPTIONS_LECTURER
            </select><br>

      <button class="btn btn-success" type="submit" name="add"> Submit </button>
      <a class="btn btn-secondary" href="course.php"> Cancel </a>
    </form>
  </div>
</body>
</html>
